[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plugent"
version = "0.1.1"
description = "Plugin-based LLM agent framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "plugent Contributors"}
]
keywords = ["llm", "agent", "plugin", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.0",
    "chromadb>=0.4.0",
    "litellm>=1.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "google-genai>=0.3.0",
    "groq>=0.5.0",
    "ollama>=0.1.0",
    "cohere>=5.0.0",
    "slowapi>=0.1.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
plugent = "plugent.cli:app"

[project.optional-dependencies]
mongo = ["pymongo>=4.6.0"]
test = ["pytest>=7.0.0", "pytest-mock>=3.0.0"]
gguf = ["llama-cpp-python>=0.2.0"]
all = [
    "plugent[mongo,test,gguf]",
]

[project.urls]
Homepage = "https://github.com/plugent/plugent"
Repository = "https://github.com/plugent/plugent"

[tool.setuptools.packages.find]
where = ["."]
include = ["plugent*"]