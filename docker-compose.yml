version: '3.8'

services:
  # Main plugent service
  plugent:
    build: .
    container_name: plugent
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./plugent.db}
      - LITELLM_MODEL=${LITELLM_MODEL:-openai}
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - REDIS_URL=redis://redis:6379
      - CHROMA_DIR=/app/chroma_data
      - COMPANY_NAME=${COMPANY_NAME:-plugent}
      - PLUGENT_API_KEY=${PLUGENT_API_KEY:-}
    volumes:
      - ./chroma_data:/app/chroma_data
      - ./plugent.db:/app/plugent.db
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional Redis for session storage
  redis:
    image: redis:7-alpine
    container_name: plugent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  redis_data: