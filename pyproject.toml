[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plugent"
version = "0.2.3"
description = "AI agent for PostgreSQL — ask questions about your database"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Anik Saha"}
]
dependencies = [
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "fastembed>=0.3.0",
    "tqdm>=4.0.0",
    "faiss-cpu>=1.7.0",
    "apscheduler>=3.10.0",
    "groq>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.12.0",
]

[project.urls]
Homepage = "https://github.com/Anik422/plugent"
Repository = "https://github.com/Anik422/plugent"

[tool.hatch.build.targets.wheel]
packages = ["plugent"]