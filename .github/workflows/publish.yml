name: Publish package on develop

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Publish package
        env:
          TWINE_USERNAME: __token__
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then
            TWINE_PASSWORD="$PYPI_API_TOKEN" python -m twine upload dist/*
          elif [ -n "$TEST_PYPI_API_TOKEN" ]; then
            TWINE_PASSWORD="$TEST_PYPI_API_TOKEN" python -m twine upload --repository-url https://test.pypi.org/legacy/ dist/*
          else
            echo "Missing PYPI_API_TOKEN or TEST_PYPI_API_TOKEN"
            exit 1
          fi